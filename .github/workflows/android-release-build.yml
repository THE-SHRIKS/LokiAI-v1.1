name: Android release build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "LokiAImobile UI/**"
      - ".github/workflows/android-release-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "LokiAImobile UI"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - name: Install pinned Android NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.12433566"
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: lokiai-android-release
          path: "LokiAImobile UI/build/app/outputs/flutter-apk/app-release.apk"
          if-no-files-found: error
          retention-days: 7
