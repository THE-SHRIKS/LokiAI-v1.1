group = "ink.xcl.fllama"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.0.21"
    ext.coroutines_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.7.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "ink.xcl.fllama"
    }

    compileSdk 35
    ndkVersion "28.0.12433566"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
        apiVersion = "2.1"
        languageVersion = "2.1"
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    externalNativeBuild {
        cmake {
            path "src/main/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    testOptions {
        unitTests {
            // Android framework calls return defaults instead of throwing, so
            // the exit-classifier tests can run off-device.
            returnDefaultValues = true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug{
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    defaultConfig {
        minSdkVersion 23
        consumerProguardFiles 'proguard-rules.pro'
        ndk {
            // CMake builds no arm32 binary for the default runtime used by
            // LlamaContext. Packaging it advertised an ABI that crashed at
            // System.loadLibrary on affected phones.
            abiFilters("arm64-v8a", "x86_64")
        }
        externalNativeBuild {
            cmake {
                cFlags "-O3 -flto -ffunction-sections -fdata-sections -fvisibility=hidden -funroll-loops -fomit-frame-pointer"
                abiFilters "arm64-v8a", "x86_64"
                cppFlags "-O3 -flto -ffunction-sections -fdata-sections -fvisibility=hidden -funroll-loops -fomit-frame-pointer"
                arguments "-Wl,--gc-sections","-DANDROID_STL=c++_static","-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON","-Wl,-z,max-page-size=16384"
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    packaging {
        dex {
            useLegacyPackaging true
        }
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            resources.excludes += "DebugProbesKt.bin"
            resources.excludes += "META-INF/DEPENDENCIES"
            resources.excludes += "META-INF/NOTICE"
            resources.excludes += "META-INF/LICENSE"
            resources.excludes += "META-INF/LICENSE.txt"
            resources.excludes += "META-INF/NOTICE.txt"
            resources.excludes += "META-INF/LICENSE.md"
            resources.excludes += "META-INF/LICENSE-notice.md"
            resources.excludes += "META-INF/{AL2.0,LGPL2.1,LICENSE,NOTICE,DEPENDENCIES}"
            resources.excludes += "DebugProbesKt.bin"
            resources.excludes += "META-INF/*.kotlin_module"
            resources.excludes += "**/*.kotlin_module"
            resources.excludes += "**/*.version"
        }
    }
}

dependencies {
    // Do not pump unless dropping support for AGP7
    implementation platform("org.jetbrains.kotlin:kotlin-bom:$kotlin_version")
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    // Off-device unit tests for the inference-service exit classifier and
    // structured diagnostics (see src/test). org.json is stubbed to throw in
    // unit tests by default, so a real implementation is supplied.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
